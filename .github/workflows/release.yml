name: Release

# Creates a GitHub release (and its tag) whenever the version in
# custom_components/resel_fxo_gateway/manifest.json is new. HACS then offers it as an update.
on:
  push:
    branches: [main]
    paths:
      - custom_components/resel_fxo_gateway/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(jq -r .version custom_components/resel_fxo_gateway/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create release if the tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
